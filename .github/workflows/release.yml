name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --build-arg MODEL_VERSION="$VERSION" -t "$IMAGE:$VERSION" .

      - name: Start container
        run: docker run -d --name smoke -p 80:80 "$IMAGE:$VERSION"

      - name: Wait for service
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:80/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Service did not become healthy"; exit 1

      - name: Smoke test /health
        run: |
          curl -fsS http://localhost:80/health | tee health.json
          grep -q "\"model_version\":\"$VERSION\"" health.json

      - name: Smoke test /predict
        run: |
          curl -fsS -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"age":0.02,"sex":-0.044,"bmi":0.06,"bp":-0.03,"s1":-0.02,"s2":0.03,"s3":-0.02,"s4":0.02,"s5":0.02,"s6":-0.001}' \
            | tee predict.json
          grep -q '"prediction"' predict.json

      - name: Smoke test invalid input returns 422
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"age":0.02,"sex":-0.044,"bmi":0.06,"bp":-0.03,"s1":-0.02,"s2":0.03,"s3":-0.02,"s4":0.02,"s5":0.02}')
          echo "HTTP $code"
          test "$code" = "422"

      - name: Show container logs on failure
        if: failure()
        run: docker logs smoke

      - name: Extract metrics from the image
        run: docker cp smoke:/app/metrics.json metrics.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE:$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Image"
            echo "docker pull $IMAGE:$VERSION"
            echo
            echo "## Metrics"
            echo '```json'
            cat metrics.json
            echo '```'
            echo
            cat CHANGELOG.md
          } > RELEASE_NOTES.md
          gh release create "$VERSION" metrics.json --title "$VERSION" --notes-file RELEASE_NOTES.md

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ github.ref_name }}
          path: metrics.json